name: Terraform

# ──────────────────────────────────────────────────────────────────────────
# Every `run:` delegates to a Taskfile task — see the `github-actions` and
# `taskfile` skills. Task names follow `action:env` (`plan:dev`, never `dev:plan`).
#
# Tools come from .github/actions/setup-tools (pinned setup actions), NOT devbox:
# devbox is the developer environment. Its declared versions are what setup-tools
# must match — see "Keeping CI and devbox in sync" in the github-actions skill.
#
# ACTION PINNING: every `uses:` is pinned to a full 40-char commit SHA with the
# version in a trailing comment, so Renovate/Dependabot can bump it. See the
# `github-actions` skill, "Pinning actions to digests".
# ──────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Never cancel an in-flight apply.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Validate, lint & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          terraform: "true"

      # fmt:check fails on drift instead of rewriting files — CI must not mutate
      # the tree. `task fmt` is the local-only, rewriting variant.
      - name: Format check
        run: task fmt:check

      - name: Validate
        run: task validate

      - name: Lint (fast)
        run: task lint

      - name: Audit (tflint + tfsec, strict)
        run: task audit

      - name: Upload audit results
        if: always() # upload even on failure so triage is possible
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-results
          path: audit-results/
          retention-days: 7

  plan:
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write # OIDC federation
      pull-requests: write # plan-comment posting
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          terraform: "true"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets[format('AWS_{0}_ROLE_ARN', matrix.env)] }}
          aws-region: us-east-1

      - name: Plan
        run: task plan:${{ matrix.env }}

      - name: Upload plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ matrix.env }}
          path: plan-${{ matrix.env }}.tfplan
          retention-days: 1

  apply-dev:
    name: Apply (dev)
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          terraform: "true"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEV_ROLE_ARN }}
          aws-region: us-east-1

      - name: Plan
        run: task plan:dev

      - name: Apply
        run: task apply:dev

  apply-prod:
    name: Apply (prod)
    runs-on: ubuntu-latest
    needs: apply-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production # configure required reviewers in GitHub settings
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          terraform: "true"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: us-east-1

      - name: Plan
        run: task plan:prod

      - name: Apply
        run: task apply:prod
